# Расписание навыка arxiv-digest (P2).
# Каталог ~/.hermes/cron/ читается планировщиком шлюза при старте.
# Альтернативно та же задача ставится командой в чате:
#   «Каждый день в 9 утра присылай дайджест arxiv по RUL»
id: arxiv-digest-daily
skill: arxiv-digest
schedule: "0 9 * * *"        # каждый день в 09:00 по времени сервера (UTC — см. TZ VPS)
deliver_to: telegram          # куда отправлять результат
enabled: true
on_failure: notify            # при ошибке — уведомить пользователя, не молчать
