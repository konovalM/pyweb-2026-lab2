# Конфиг агента (Hermes) — провайдер Google Gemini (OpenAI-совместимый эндпоинт).
model:
  provider: "openai"                       # Gemini отдаёт OpenAI-совместимый /v1beta/openai
  default: "gemini-flash-lite-latest"      # Flash-Lite: 1M контекст, tool-use, быстрая, высокий free-лимит, доступна
  context_length: 1048576                  # ~1M контекст
  fallback:
    - "gemini-3.1-flash-lite"              # запасные при 503/перегрузке
    - "gemini-3-flash-preview"
  temperature: 0.2

gateways:
  telegram:
    enabled: true
  cli:
    enabled: true

tools:
  web_search: true
  web_fetch: true
  files: true
  shell:
    enabled: true
    allowlist: ["git", "python3", "mkdocs", "ls", "cat", "curl"]
    confirm_destructive: true
  scheduler: true

observability:
  log_steps: true
  log_tokens: true
  dashboard: false

platform_toolsets:
  telegram: ["web", "file", "terminal", "skills", "cronjob", "memory", "todo", "session_search"]
  cli: ["web", "file", "terminal", "skills", "cronjob", "memory"]
