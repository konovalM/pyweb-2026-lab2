# ─────────────────────────────────────────────────────────────────────────────
# Конфиг агента.  На сервере — ~/.hermes/config.yaml (мастер `setup` создаёт его,
# этот файл показывает итоговое состояние и служит образцом для отчёта P1).
# ─────────────────────────────────────────────────────────────────────────────

# === Модель =================================================================
# Основная модель — бесплатная на OpenRouter, контекст ≥ 64k (требование задания).
# Llama 3.3 70B Instruct (free): контекст 131k, function calling — есть.
# Запасная (fallback) — Llama 4 Maverick (free), контекст 1M, на случай 429.
model:
  provider: "openrouter"
  default: "meta-llama/llama-3.3-70b-instruct:free"
  fallback:
    - "meta-llama/llama-4-maverick:free"
  # Для вспомогательных дешёвых подзадач (суммаризация, роутинг) — отдельная
  # более дешёвая модель снижает расход (приём экономии токенов, T2).
  helper: "meta-llama/llama-3.3-70b-instruct:free"
  temperature: 0.2          # ниже температура → выше воспроизводимость (T4)

# === Шлюзы ==================================================================
gateways:
  telegram:
    enabled: true
    # Токен и allowlist берутся из .env (TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS).
  cli:
    enabled: true           # командная строка для отладки на сервере

# === Инструменты (включаем нужные для исследовательских задач) ===============
tools:
  web_search: true          # веб-поиск
  web_fetch: true           # загрузка и чтение страниц
  files: true               # чтение/запись файлов
  shell:
    enabled: true
    # Белый список команд — агент не выполняет произвольный shell (T3, P5).
    allowlist:
      - "git"
      - "python3"
      - "mkdocs"
      - "ls"
      - "cat"
      - "curl"
    confirm_destructive: true   # опасные операции требуют подтверждения человеком
  scheduler: true           # cron-планировщик

# === Наблюдаемость (T4) =====================================================
observability:
  log_steps: true           # трассировка каждого шага
  log_tokens: true          # учёт расхода токенов и стоимости
  dashboard: true
